name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Xcode Project
        run: |
          mkdir -p LUIS
          cd LUIS
          
          # Create minimal Xcode project structure
          mkdir -p LUIS.xcodeproj
          mkdir -p LUIS

      - name: Generate App Files
        run: |
          cat > LUIS/LUIS/AppDelegate.swift << 'EOF'
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          class ViewController: UIViewController {
              var webView: WKWebView!
              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  webView = WKWebView(frame: .zero, configuration: config)
                  view = webView
              }
              override func viewDidLoad() {
                  super.viewDidLoad()
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }
          }
          EOF

          cp index.html LUIS/LUIS/index.html

          cat > LUIS/LUIS/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key><string>LUIS X</string>
              <key>CFBundleExecutable</key><string>LUIS</string>
              <key>CFBundleIdentifier</key><string>com.luis.suite</string>
              <key>CFBundleName</key><string>LUIS</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>MinimumOSVersion</key><string>14.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

      - name: Create Xcode Project File
        run: |
          cat > LUIS/LUIS.xcodeproj/project.pbxproj << 'PROJECTEOF'
          // !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = {};
          	objectVersion = 50;
          	objects = {
          		AA0000000000000000000001 /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000011 /* AppDelegate.swift */; };
          		AA0000000000000000000002 /* index.html in Resources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000012 /* index.html */; };
          		AA0000000000000000000003 /* Info.plist in Resources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000013 /* Info.plist */; };
          		AA0000000000000000000004 /* LaunchScreen.storyboard in Resources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000014 /* LaunchScreen.storyboard */; };
          		AA0000000000000000000010 /* LUIS.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = LUIS.app; sourceTree = BUILT_PRODUCTS_DIR; };
          		AA0000000000000000000011 /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
          		AA0000000000000000000012 /* index.html */ = {isa = PBXFileReference; lastKnownFileType = text.html; path = index.html; sourceTree = "<group>"; };
          		AA0000000000000000000013 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          		AA0000000000000000000014 /* LaunchScreen.storyboard */ = {isa = PBXFileReference; lastKnownFileType = file.storyboard; path = LaunchScreen.storyboard; sourceTree = "<group>"; };
          		AA0000000000000000000020 /* LUIS */ = {isa = PBXGroup; children = (AA0000000000000000000011, AA0000000000000000000012, AA0000000000000000000013, AA0000000000000000000014); path = LUIS; sourceTree = "<group>"; };
          		AA0000000000000000000030 = {isa = PBXGroup; children = (AA0000000000000000000020, AA0000000000000000000040); sourceTree = "<group>"; };
          		AA0000000000000000000040 /* Products */ = {isa = PBXGroup; children = (AA0000000000000000000010); name = Products; sourceTree = "<group>"; };
          		AA0000000000000000000050 /* LUIS */ = {isa = PBXNativeTarget; buildConfigurationList = AA0000000000000000000060; buildPhases = (AA0000000000000000000051, AA0000000000000000000052); buildRules = (); dependencies = (); name = LUIS; productName = LUIS; productReference = AA0000000000000000000010; productType = "com.apple.product-type.application"; };
          		AA0000000000000000000051 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (AA0000000000000000000001); runOnlyForDeploymentPostprocessing = 0; };
          		AA0000000000000000000052 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (AA0000000000000000000002, AA0000000000000000000003, AA0000000000000000000004); runOnlyForDeploymentPostprocessing = 0; };
          		AA0000000000000000000070 /* Project object */ = {isa = PBXProject; attributes = {LastUpgradeCheck = 1400;}; buildConfigurationList = AA0000000000000000000080; compatibilityVersion = "Xcode 12.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = AA0000000000000000000030; productRefGroup = AA0000000000000000000040; projectDirPath = ""; projectRoot = ""; targets = (AA0000000000000000000050); };
          		AA0000000000000000000090 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ALWAYS_SEARCH_USER_PATHS = NO; CLANG_ENABLE_MODULES = YES; CLANG_ENABLE_OBJC_ARC = YES; IPHONEOS_DEPLOYMENT_TARGET = 14.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0;}; name = Debug; };
          		AA0000000000000000000091 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ALWAYS_SEARCH_USER_PATHS = NO; CLANG_ENABLE_MODULES = YES; CLANG_ENABLE_OBJC_ARC = YES; IPHONEOS_DEPLOYMENT_TARGET = 14.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0;}; name = Release; };
          		AA0000000000000000000060 /* Build configuration list for PBXNativeTarget */ = {isa = XCConfigurationList; buildConfigurations = (AA0000000000000000000092, AA0000000000000000000093); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          		AA0000000000000000000092 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {INFOPLIST_FILE = LUIS/Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.luis.suite; PRODUCT_NAME = LUIS;}; name = Debug; };
          		AA0000000000000000000093 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {INFOPLIST_FILE = LUIS/Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.luis.suite; PRODUCT_NAME = LUIS;}; name = Release; };
          		AA0000000000000000000080 /* Build configuration list for PBXProject */ = {isa = XCConfigurationList; buildConfigurations = (AA0000000000000000000090, AA0000000000000000000091); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
          	};
          	rootObject = AA0000000000000000000070 /* Project object */;
          }
          PROJECTEOF

          cat > LUIS/LUIS/LaunchScreen.storyboard << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="17701" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="414" height="896"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" red="0.019607843137254902" green="0.019607843137254902" blue="0.0392156862745098" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          EOF

      - name: Build App
        run: |
          cd LUIS
          xcodebuild -project LUIS.xcodeproj -scheme LUIS -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r LUIS/build/Build/Products/Release-iphoneos/LUIS.app Payload/
          zip -r LUIS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUIS-IPA
          path: LUIS.ipa
